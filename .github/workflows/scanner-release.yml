name: PCForge Scanner Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.2.0
        required: true
        default: 0.2.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build PCForge.exe
        working-directory: scanner
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags='-s -w' -o ../PCForge.exe .
      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path PCForge.exe)) { throw 'PCForge.exe was not created.' }
          Get-Item PCForge.exe | Select-Object Name,Length
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: PCForge Scanner v${{ inputs.version }}
          generate_release_notes: true
          files: PCForge.exe
