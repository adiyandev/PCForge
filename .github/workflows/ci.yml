name: PCForge CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate Electron JavaScript
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/system.cjs
      - name: Build web
        run: npm run build
      - name: Build desktop renderer
        run: npm run build:desktop
